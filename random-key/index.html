<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Key Signature</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="menu-btn" aria-label="Open Key Selection Menu">&#9776;</button>

  <div id="sidebar">
    <button id="close-sidebar-btn" aria-label="Close Menu">&times;</button>
    <h2>Settings</h2>
    <div class="auto-change-group">
      <label class="toggle-label" for="auto-change-toggle">
        <span>Auto-change</span>
        <input type="checkbox" id="auto-change-toggle">
        <span class="toggle-slider"></span>
      </label>
      <div class="interval-control" id="interval-control">
        <label for="interval-input">Interval</label>
        <div class="interval-input-row">
          <input type="range" id="interval-range" min="0.5" max="10" step="0.5" value="1">
          <input type="number" id="interval-input" min="0.5" max="60" step="0.5" value="1">
          <span>s</span>
        </div>
      </div>
    </div>
    <h2>Select Keys</h2>
    <div class="key-group">
      <h3>Major Keys <button class="select-all" data-type="major">All</button> <button class="select-none" data-type="major">None</button></h3>
      <div id="major-keys-container"></div>
    </div>
    <div class="key-group">
      <h3>Minor Keys <button class="select-all" data-type="minor">All</button> <button class="select-none" data-type="minor">None</button></h3>
      <div id="minor-keys-container"></div>
    </div>
  </div>

  <div id="staff-container"></div>
  <div id="key-name"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vexflow/1.2.93/vexflow-min.js"></script>
  <script src="script.js"></script>
</body>
</html>
