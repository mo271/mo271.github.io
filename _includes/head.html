<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width initial-scale=1" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <!-- Follow the visitor's light/dark preference (light when none is set), see css/main.scss -->
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#{{ site.backgroundcolor }}">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#{{ site.darkbackgroundcolor }}">

    <title>{% if page.browsertitle %}{{ page.browsertitle }}{% else %}{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}{% endif %}</title>
    <meta name="description" content="{{ site.description }}">

    <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.8.3/katex.min.css">
    <link rel="icon" type="image/x-icon" href="{{ "/m.ico" | prepend: site.baseurl}}">
    {% seo %}
</head>
