<footer class="site-footer">

  <div class="wrapper">

    <div class="footer-col-wrapper">
      <div class="footer-col  footer-col-1">
        <ul class="contact-list">
          <li>{{ page.createdby }} <a href="{{ site.baseurl }}/">{{ site.title }}</a></li>
        </ul>
      </div>

      <div class="footer-col  footer-col-2">
        <ul class="social-media-list">
          {% if site.mastodon_username %}
          <li>
            <a rel="me" href="https://mathstodon.xyz/{{ site.mastodon_username }}">{% include icon-mastodon.html %} Mastodon</a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>

  </div>

</footer>
