# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Moritz Firsching
email: moritz.firsching@gmail.com
description: "Mathematician and software engineer. Formalisation and AI"
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://firsching.ch" # the base hostname & protocol for your site, e.g. http://example.com
github_username:  mo271
twitter_username: MoritzFirsching
mastodon_username: "@MoritzFirsching"
mathoverflow_username: 39495

# exclude from generating co-authors
my_authortag: moritz

collections:
    papers:
        output: true

# Build settings
markdown: kramdown
kramdown:
  input: GFM
theme: minima

webrick:
  headers:
    cross-origin-embedder-policy: require-corp
    cross-origin-opener-policy: same-origin

plugins:
  - jekyll-seo-tag

# Default social preview image (og:image / twitter:image) for every page,
# consumed by jekyll-seo-tag. Override per page with `image:` in front matter.
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/images/small_moritz.jpg
        width: 768
        height: 768
        alt: Photo of Moritz Firsching

# Square photo: small card layout looks better than summary_large_image.
twitter:
  username: MoritzFirsching
  card: summary

brandcolor:  2a7ae2
backgroundcolor: fdfdfd
greycolor: "828282"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
